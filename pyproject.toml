# Repository-level tooling for release-management-harness (Slice 1 - Scaffold; NFR-03, NFR-06, NFR-09).
# Service runtime dependencies live in services/*/pyproject.toml.

[project]
name = "release-management-harness"
version = "0.1.0"
description = "Governed AI-native release-management harness (repository tooling)"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "pyyaml>=6.0",
    "types-PyYAML>=6.0",
    "httpx>=0.27",
    "pre-commit>=3.7",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "services/release-api/src", "services/release-mcp/src"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["release_api", "release_mcp", "tests"]

[tool.ruff.lint.per-file-ignores]
# Tests use assert, invoke git to enumerate repository files, and compare secret reference names (not values).
"tests/**" = ["S101", "S105", "S603", "S607"]

[tool.mypy]
python_version = "3.12"
# Strict everywhere, which includes the domain code.
strict = true
plugins = ["pydantic.mypy"]
explicit_package_bases = true
mypy_path = ["services/release-api/src", "services/release-mcp/src", "."]
exclude = ['^\.venv/', '^venv/', '(^|/)build/', '(^|/)dist/']
