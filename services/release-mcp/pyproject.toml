[project]
name = "release-mcp"
version = "0.1.0"
description = "Release MCP server: exposes only the allow-listed release tools and calls only the Release API"
requires-python = ">=3.12"
# Must never include a database driver, ORM or migration tool (tests/architecture/test_layering.py).
dependencies = [
    "mcp>=1.2",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
