# Builds the service images (no push). Publishing is part of packaging (Slice 12).
name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build release-api image
        run: docker build -t release-api:ci services/release-api
      - name: Build release-mcp image
        run: docker build -t release-mcp:ci services/release-mcp
