# Pre-commit hooks (Slice 1; NFR-03). Install once: pre-commit install
# mypy runs from the active project environment (.venv) so it sees the installed services and type stubs.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict)
        entry: mypy .
        language: system
        types: [python]
        pass_filenames: false
