# Alembic configuration (Slice 1 skeleton; schema migrations arrive in Slice 2).
# Run: alembic -c db/migrations/alembic.ini upgrade head
# sqlalchemy.url is intentionally absent: env.py builds it at runtime from environment variables populated by the
# approved secret provider. Never put credentials in this file.

[alembic]
script_location = %(here)s
version_locations = %(here)s/versions
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
