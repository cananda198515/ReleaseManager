# Alembic configuration (Slice 2): section 4.1 schema, run as the migration identity.
# Run: alembic -c db/migrations/alembic.ini upgrade head
# sqlalchemy.url is intentionally absent: env.py builds it at runtime from environment variables populated by the
# approved secret provider. Never put credentials in this file.

[alembic]
script_location = %(here)s
# Revisions live in the default <script_location>/versions. version_locations is deliberately not set: Alembic splits
# it on spaces, which silently breaks checkouts whose path contains spaces.
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
